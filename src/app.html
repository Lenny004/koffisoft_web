<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        if (localStorage.getItem('koffi-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        /* La preferencia visual no debe bloquear el renderizado inicial. */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
